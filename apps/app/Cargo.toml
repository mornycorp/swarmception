[package]
name = "swarmception"
description = "Swarmception: a swarm's activity on a timeline, from its tracking branch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
eframe = { workspace = true }
swarmception-ui = { workspace = true }
swarmception-engine = { workspace = true }
swarmception-domain = { workspace = true }
swarmception-model = { workspace = true }
swarmception-automation = { workspace = true }
swarmception-source = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
# The event loop the window runs on (`place::Launch`, #178): eframe's own winit, its features set by
# eframe, so the monitors are read before the window opens and its saved place is checked on them.
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
# A screenshot's PNG read back (#60); `ui.set`'s schema, as MCP lists it.
png = { workspace = true }
schemars = { workspace = true }

[lints]
workspace = true
