[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `cargo run -- --repo <path>` runs the app.
default-members = ["apps/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# The swarm tooling (claims, tracking, the gates, stack and land), pinned by revision.
swarm-core = { git = "https://github.com/mornycorp/swarm-core.git", rev = "d4a0194e666a88681a1123a0cfa882fda16f2a0b" }
# The timeline widget (its model, engine and egui widget), pinned by revision.
timeline-core = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "ed630f13bc159ae3a756019a667327b201b0548c" }
timeline-engine = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "ed630f13bc159ae3a756019a667327b201b0548c" }
timeline-egui = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "ed630f13bc159ae3a756019a667327b201b0548c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_path_to_error = "0.1"
egui = "0.37"
eframe = "0.37"
# The macOS system menu bar (owner-approved, 2026-10-31, #3); no GTK on Linux.
muda = { version = "0.21.2", default-features = false }
# AppKit from Rust, as winit and muda already lock it: window tabbing off (#9).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
swarmception-model = { path = "crates/model" }
swarmception-domain = { path = "crates/domain" }
swarmception-source = { path = "crates/source" }
swarmception-engine = { path = "crates/engine" }
swarmception-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
