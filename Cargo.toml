[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `cargo run -- --repo <path>` runs the app.
default-members = ["apps/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# The swarm tooling (claims, tracking, the gates, stack and land), pinned by revision.
swarm-core = { git = "https://github.com/mornycorp/swarm-core.git", rev = "d4a0194e666a88681a1123a0cfa882fda16f2a0b" }
# The timeline widget (its model, engine and egui widget), pinned by revision.
timeline-core = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "a603fbae89fc2d1ccac8a5c7f22b552be79b6fde" }
timeline-engine = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "a603fbae89fc2d1ccac8a5c7f22b552be79b6fde" }
timeline-egui = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "a603fbae89fc2d1ccac8a5c7f22b552be79b6fde" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_path_to_error = "0.1"
egui = "0.37"
eframe = "0.37"
# The macOS system menu bar (owner-approved, 2026-10-31, #3); no GTK on Linux.
muda = { version = "0.21.2", default-features = false }
swarmception-model = { path = "crates/model" }
swarmception-domain = { path = "crates/domain" }
swarmception-source = { path = "crates/source" }
swarmception-engine = { path = "crates/engine" }
swarmception-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
