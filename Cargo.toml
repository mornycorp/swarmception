[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `cargo run -- --repo <path>` runs the app.
default-members = ["apps/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# The swarm tooling (claims, tracking, the gates, stack and land), pinned by revision.
swarm-core = { git = "https://github.com/mornycorp/swarm-core.git", rev = "63a43025f7258d773091ab993df154212697965b" }
# The timeline widget (its model, engine and egui widget), pinned by revision.
timeline-core = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "7e372fed8fef05c731e63b869c20d456f9ee2dd9" }
timeline-engine = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "7e372fed8fef05c731e63b869c20d456f9ee2dd9" }
timeline-egui = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "7e372fed8fef05c731e63b869c20d456f9ee2dd9" }
# The widget's control protocol pieces (the line reader, the token, the loopback bind), same pin.
timeline-automation = { git = "https://github.com/mornycorp/swarm-timeline.git", rev = "7e372fed8fef05c731e63b869c20d456f9ee2dd9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_path_to_error = "0.1"
egui = "0.37"
eframe = "0.37"
# Screenshots as PNG (#60): already in the lock through egui's text rasterizer (epaint, glifo).
png = "0.18"
# The macOS system menu bar (owner-approved, 2026-10-31, #3); no GTK on Linux.
muda = { version = "0.21.2", default-features = false }
# AppKit from Rust, as winit and muda already lock it: window tabbing off (#9).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel", "NSSavePanel", "NSOpenPanel"] }
# File ▸ Open…'s folder (#69): AppKit's own open panel, through the objc2 crates already locked
# (no new crate; `rfd` would bring its own on every platform).
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
swarmception-model = { path = "crates/model" }
swarmception-domain = { path = "crates/domain" }
swarmception-source = { path = "crates/source" }
swarmception-engine = { path = "crates/engine" }
swarmception-ui = { path = "crates/ui" }
swarmception-automation = { path = "crates/automation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
